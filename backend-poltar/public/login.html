<!DOCTYPE html>
<html lang="id" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk Akun | Polisi Taruna SMKN 2 Depok</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Design System -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body class="ambient-bg min-h-screen flex items-center justify-center p-4 text-slate-100">

    <div class="w-full max-w-md glass-card p-8 relative z-10 shadow-2xl my-8 glow-border">

        <!-- Logo & Header -->
        <div class="text-center mb-6">
            <div class="flex justify-center mb-3">
                <div class="p-3 bg-[#090d16] rounded-xl border border-white/10 shadow-lg">
                    <img src="assets/images/logopoltar.jpg" alt="Logo Poltar"
                        class="w-12 h-12 object-contain mix-blend-screen">
                </div>
            </div>
            <h1 class="text-2xl font-extrabold text-white tracking-tight">
                Polisi <span class="text-rose-400">Taruna</span>
            </h1>
            <p class="text-xs text-slate-400 mt-1">Portal Layanan &amp; Administrasi SMKN 2 Depok</p>
        </div>

        <!-- Google Login for Students / General Users -->
        <div class="mb-5">
            <a href="http://127.0.0.1:8000/api/auth/google" id="btnGoogleLogin"
                class="w-full bg-white hover:bg-slate-100 text-slate-900 font-semibold py-2.5 px-4 rounded-lg flex items-center justify-center gap-3 transition text-xs shadow-sm">
                <svg class="w-4 h-4" viewBox="0 0 24 24">
                    <path fill="#4285F4"
                        d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                    <path fill="#34A853"
                        d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                    <path fill="#FBBC05"
                        d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" />
                    <path fill="#EA4335"
                        d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" />
                </svg>
                <span>Masuk dengan Akun Google</span>
            </a>
        </div>

        <div class="relative my-5 text-center">
            <div class="absolute inset-0 flex items-center">
                <div class="w-full border-t border-white/10"></div>
            </div>
            <span class="relative bg-[#0f172a] px-3 text-[11px] text-slate-400 rounded-full">atau Masuk sebagai Petugas</span>
        </div>

        <!-- Manual Login Form for Staff/Admin -->
        <form id="formLogin" onsubmit="handleLogin(event)" class="space-y-3.5 text-xs">
            <div>
                <label class="block text-slate-300 mb-1 font-medium">Alamat Email :</label>
                <input type="email" id="login_email" required class="form-control"
                    placeholder="masukkan email admin">
            </div>
            <div>
                <label class="block text-slate-300 mb-1 font-medium">Kata Sandi :</label>
                <div class="relative">
                    <input type="password" id="login_password" required class="form-control pr-10"
                        placeholder="••••••••">
                    <button type="button" onclick="togglePasswordVisibility()" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white">
                        <svg id="eyeIcon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                    </button>
                </div>
            </div>
            <button type="submit" id="btnLoginSubmit" class="w-full btn-primary text-xs !py-2.5 font-bold mt-2">
                <span>Masuk ke Panel Petugas</span>
            </button>
        </form>

        <div class="text-center mt-6 pt-4 border-t border-white/5">
            <a href="index.html" class="text-xs text-slate-400 hover:text-white inline-flex items-center gap-1.5 transition">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                </svg>
                <span>Kembali ke Beranda Utama</span>
            </a>
        </div>
    </div>

    <script src="assets/js/config.js"></script>
    <script>
        const API_BASE = typeof API_BASE_URL !== 'undefined' ? API_BASE_URL : 'http://127.0.0.1:8000/api';

        // Update link Google Login agar selalu sesuai dengan backend yang aktif
        document.addEventListener('DOMContentLoaded', () => {
            const googleLink = document.getElementById('btnGoogleLogin');
            if (googleLink) {
                const currentOrigin = encodeURIComponent(window.location.origin);
                googleLink.href = `${API_BASE}/auth/google?redirect_to=${currentOrigin}`;
            }
        });

        function togglePasswordVisibility() {
            const pwdInput = document.getElementById('login_password');
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
            } else {
                pwdInput.type = 'password';
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('login_email').value;
            const password = document.getElementById('login_password').value;
            const btn = document.getElementById('btnLoginSubmit');

            if (btn) {
                btn.disabled = true;
                btn.innerHTML = 'Memproses...';
            }

            try {
                const res = await fetch(`${API_BASE}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();

                if (res.ok && data.success) {
                    localStorage.setItem('auth_token', data.token);
                    localStorage.setItem('user_name', data.user.name);
                    localStorage.setItem('user_role', data.user.role);

                    Swal.fire({
                        icon: 'success',
                        title: 'Berhasil Masuk',
                        text: `Selamat datang kembali, ${data.user.name}.`,
                        background: '#0f172a',
                        color: '#f8fafc',
                        confirmButtonColor: '#e11d48'
                    }).then(() => {
                        if (data.user.role === 'admin') {
                            window.location.href = 'admin.html';
                        } else {
                            window.location.href = 'index.html';
                        }
                    });
                } else {
                    Swal.fire({
                        icon: 'error',
                        title: 'Gagal Masuk',
                        text: data.message || 'Email atau kata sandi tidak sesuai.',
                        background: '#0f172a',
                        color: '#f8fafc',
                        confirmButtonColor: '#e11d48'
                    });
                }
            } catch (err) {
                Swal.fire({
                    icon: 'error',
                    title: 'Koneksi Terputus',
                    text: `Tidak dapat terhubung ke server backend (${typeof BACKEND_BASE_URL !== 'undefined' ? BACKEND_BASE_URL : 'http://127.0.0.1:8000'}). Pastikan server backend sedang aktif.`,
                    background: '#0f172a',
                    color: '#f8fafc',
                    confirmButtonColor: '#e11d48'
                });
            } finally {
                if (btn) {
                    btn.disabled = false;
                    btn.innerHTML = '<span>Masuk ke Panel Petugas</span>';
                }
            }
        }
    </script>
</body>

</html>
